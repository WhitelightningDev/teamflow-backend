<!doctype html>
<html>
  <body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#f8fafc; color:#0f172a; padding:24px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:640px; margin:0 auto; background:#ffffff; border:1px solid #e5e7eb; border-radius:12px;">
      <tr>
        <td style="padding:24px;">
          <h1 style="margin:0 0 12px; font-size:20px;">Reset your {{ company_name }} password</h1>
          <p style="margin:0 0 16px;">Hello {{ first_name }},</p>
          <p style="margin:0 0 16px;">We received a request to reset your password. Click the button below to set a new password.</p>
          <p style="margin:24px 0;">
            <a href="{{ reset_url }}" style="display:inline-block; background:#2563eb; color:#ffffff; text-decoration:none; padding:10px 16px; border-radius:8px;">Reset Password</a>
          </p>
          <p style="margin:0 0 16px;">If you didn’t request this, you can safely ignore this email.</p>
          <p style="margin:0; font-size:12px; color:#64748b;">This link expires in 24 hours.</p>
        </td>
      </tr>
    </table>
  </body>
  </html>
